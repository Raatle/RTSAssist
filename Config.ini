{
	##Config##
	
	# If you are using LunaLib, treat this as a defaults config file. I.e., if you reset the settings in the luna menu they'll
	# revert to what is contained in this file. If you are not using lunalib, settings can be changed here. Be aware however
	# that any update to RTSAssist will reset this file. I will remedy this but for the time being use Luna.

	#---------------------------#
	#** Control Customisation **#
	#---------------------------#

	# Change the speed of SIDE SCROLLING using the MOUSE. (a whole number greater than 0)
	# 调整使用【鼠标】平移视角的滚动速度。（填入大于 0 的整数）
	"scrollSpeed": 25,
	# Change how much SMOOTHING is applied to SIDESCROLLING using the MOUSE. (a whole number greater than 0)
	# 调整使用【鼠标】平移视角时的平滑程度。（填入大于 0 的整数）
	"scrollSmoothing": 7,
	# Change the speed of SIDE SCROLLING using the KEYBOARD. (a whole number greater than 0)
	# 调整使用【键盘】平移视角的滚动速度。（填入大于 0 的整数）
	"scrollSpeedKeyboard": 20,
	# Change how much SMOOTHING is applied to SIDESCROLLING using the KEYBOARD. (a whole number greater than 0)
	# 调整使用【键盘】平移视角时的平滑程度。（填入大于 0 的整数）
	"scrollSmoothingKeyboard": 7,
	# Change the default ZOOM SENSITIVITY. (a decimal number greater than 0)
	# 调整默认的缩放灵敏度。（填入大于 0 的小数）
	"zoomSensi": 1,
	# Change the default MINIMUM ZOOM. (a decimal number greater than 0)
	# 调整默认的最小缩放级别。（填入大于 0 的小数）
	"minZoom": 1,
	# Change the default MAXIMUM ZOOM. (a whole number greater than 0)
	# 调整默认的最大缩放视野距离。（填入大于 0 的整数）
	"maxZoom": 3,
	# Adjusts the error tolerance for selecting ships. (a whole number greater than 0)
	# 调整选取舰船时的容错判定范围。（填入大于 0 的整数）
	"selectionTolerance": 2,

	#----------------------------#
	#** GamePlay Customisation **#
	#----------------------------#
	
	# Set the default STARTING MODE. (true or false)

	#----------------------------#
	#**游戏机制自定义**#
	#----------------------------#
	
	# 设置入战时的默认初始模式。（true 或 false）
	"defaultModeIsRTS": true,
	# Remember zoom on mode switch. (true or false)
	# 切换模式时记忆各自的缩放级别。（true 或 false）
	"rememberZoom": false,
	# PAUSE when changing to RTS mode and unpause whens switching back to VANILLA. (true or false)
	# 切换至 RTS 模式时自动暂停，切回原版模式时解除暂停。（true 或 false）
	"pauseUnpause": true,
	# Switch the DEFAULT behaviour of RIGHT CLICK. IF "true", a single click will instead create a
	# move and hold command. (true or false)
	# 互换右键的默认操作逻辑。若设为【true】，单次右键将改为执行
	# 移动并坚守命令。（true 或 false）
	"switchRightClick": false,
	# Alternative Rotation. An alternative method for rotating formations that requires less mouse
	# movement. (true or false)
	# 备选旋转控制。一种仅需较小幅度鼠标移动即可
	# 完成阵型旋转的替代方式。（true 或 false）
	"alternativeRotation": false,
	
	#----------------------#
	#** UI Confgiuration **#
	#----------------------#
	
	# Change the VOLUME for COMMANDS and SELECTION feedback. (a whole number greater than or equal to 0, not higher than 10)
	
	#----------------------#
	#**界面配置**#
	#----------------------#
	
	# 调整下达命令和选中反馈的提示音量。（填入 0 到 10 之间的整数）
	"UICommandVolume": 5,
	# Whether to show the RTSAssist minimap. Initialized from this setting when combat starts; can also be toggled at any time with the hotkey.
	# The minimap sits at the bottom-right of the screen by default; hold Shift and drag to move it (the position is remembered).
	# You can also use the toggleMiniMap hotkey to show/hide it at any time during combat. (true or false)
	# 是否显示 RTSAssist 小地图。入战时按此设置初始化，战斗中也可随时用热键切换。
	# 小地图默认位于屏幕右下角，按住 Shift 并拖拽可移动其位置（位置会被自动记住）。
	# 也可用热键 toggleMiniMap 在战斗中随时显示/隐藏。（true 或 false）
	"showMiniMap": true,
	# Refresh period of the minimap's frame data; also the duration of one full sweep cycle.
	# (a whole number from 16 to 2000, in milliseconds)
	# 调整小地图画面数据的刷新周期，也是一个完整扫描循环的时长。
	# （填入 16 到 2000 之间的整数，单位毫秒）
	"miniMapRefreshMs": 1010,
	# How long each sweep phase (ships / fighters) takes to finish scanning all units.
	# Each cycle goes: sweep ships, hold, sweep fighters, hold. (a whole number from 16 to 1000, in milliseconds)
	# 调整每个扫描相位（舰船/战机）扫完全部单位所用的时间。
	# 每个周期内依次为：扫描舰船、保持、扫描战机、保持。（填入 16 到 1000 之间的整数）
	"miniMapSweepMs": 200,
	# Whether to render the black fog of war covering areas of the battlefield your ships cannot see. (true or false)
	# 是否渲染战场上的黑色战争迷雾（己方舰船视野之外的黑色遮罩）。（true 或 false）
	"showFogOfWar": true,

	#-----------------------#
	#** Mod Confgiuration **#
	#-----------------------#

	# Manually adjust UI SCALING. If using in game UI scaling this should not be necesary.
	# Value is in percent but dont add the "%". (a whole number greater than 0)

	#-----------------------#
	#**模组配置**#
	#-----------------------#

	# 手动调整界面缩放比例。若已在游戏内设置了 UI 缩放，通常无需调整。
	# 数值按百分比填写，但不要带有【%】符号。（填入大于 0 的整数）
	"screenScaling": "100",

	# Still in development. Currently, ships will only abandon assignments when faced with rapid destruction.
	# I.e., They will not run if they are slowly being destroyed, even to the point of death. However if
	# 5 reapers are about to strike them and they are likely about to be incinerated, they might abandon
	# their assignment. (true or false)

	# 该功能仍在开发中。目前舰船仅在面临瞬间被摧毁的致命危机时才会放弃当前命令。
	# 也就是说，即使舰船受到持续消耗直至被慢慢击沉，它们也不会擅自逃离；但如果
	# 即将遭遇 5 发死神鱼雷直击且几乎必沉无疑，它们便可能会主动放弃
	# 当前命令进行避险。（true 或 false）
	"shipsWillRun": false,
	
	#------------#
	#** Legacy **#
	#------------#
	
	# For users that created their save game on version 0.1.5- and lower. Set to false to disable mod.
	
	#------------#
	#**旧版兼容**#
	#------------#
	
	# 供在 0.1.5 及更早版本创建存档的玩家使用。设为 false 可停用本模组。
	"isEnabled": true,
	
	#-------------------#
	#** Modding Tools **#
	#-------------------#
	
	
	#-------------------#
	#**模组开发工具**#
	#-------------------#
	
	"enableShipTestSuite": false,
	"modID": "",
	"findAllShips": false,


}
