{
	# WARNING: Always use capitals for hotKeys.

	##Hotkeys##
	
	# If you are using LunaLib, treat this as a defaults key file. I.e., if you reset the keys in the luna menu they'll
	# revert to what is contained in this file. If you are not using lunalib, hotkeys can be changed here. Be aware however
	# that any update to RTSAssist will reset this file. I will remedy this but for the time being use Luna.

	# Be aware that while in RTS mode these keys will only interact with the mod and there old functions will be disabled.
	# While not in RTS mode these hotkey will do nothing with the only exception being the ability to toggle RTS mode.

	# Enable/disable RTS mode. If left blank, CAPSLOCK is the hotkey, else its whatever you choose.

	"enable_RTSMode": "",
	
	# Keys for strafing the camera. Default (A,D,W,S -> top to bottom).
	
	"strafeCameraLeft": "A",
	"strafeCameraRight": "D",
	"strafeCameraUp": "W",
	"strafeCameraDown": "S",

	# Store the current ship positions (relative to there collective center) into memory. Default 'Q'.

	"saveLayout": "Q",

	# Retrieve the current ship positions from memory centered around the mouse position. Default 'E'.

	"loadLayout": "E",

	# Delete assignments of selected ships. Default 'X'.

	"deleteAssignments": "X",

	# Selected ships must vent. Default 'V'.

	"vent": "V",

	# Selected ships will attempt to use their system. Default 'F'.

	"useSystem": "F",

	# Causes all selected ships to move together. Default 'R'.

	"moveTogether": "R",

	# Selected ships attack move to the designated position. Will convert any move assignments before creating a new assignment. Default 'C'.

	"attackMove": "C",

	# Selected ships orbit the enemy ship under the cursor with their nose pointed at the target. Issuing the same order on the same target again reverses the orbit direction. Default 'Z'. Set to empty string "" to disable this hotkey.

	"orbitRadial": "Z",

	# Selected ships orbit the enemy ship under the cursor with their broadside facing the target. Issuing the same order on the same target again reverses the orbit direction. Default 'T'. Set to empty string "" to disable this hotkey.

	"orbitTangential": "T",

	# Selected ships keep a fixed distance from the enemy ship under the cursor (85% of their longest direct-fire weapon range by default). Default 'O'. Set to empty string "" to disable this hotkey.

	"keepDistance": "O",

	# Lock the ship under the cursor (allies and enemies alike) and fan out its info card, vanilla-R style. Press the key again on the locked ship or over empty space, or make any selection, to release the lock. Default 'L'. Set to empty string "" to disable this hotkey.

	"lockTarget": "L",
	
	# Begin broadside selection. Release to finalise. Double to enable ai side detection. Default 'B'.

	"broadsideSelection": "B",
	# Show/hide the RTSAssist minimap. Default key is 'G'. Set to empty string "" to disable this hotkey.
	# The minimap sits at the bottom-right of the screen by default; hold Shift and drag to move it (the position is remembered).

	"toggleMiniMap": "G",


	# Hold key and drag mouse to translate all selected ships.
	# Is finalised upon mouse release. Is cancellable by releasing key.

	# "alt" -> not configurable yet

	# Hold and drag mouse to rotate all selected around point defined by mouseDown.
	# Is finalised upon mouse release. Is cancellable by releasing key.

	# "alt and left control", -> not configurable yet

	# Pan the camera using these controls.

	# "strafeCameraLeft": "A", -> not configurable yet
	# "strafeCameraRight": "D", -> not configurable yet
	# "strafeCameraUp": "W", -> not configurable yet
	# "strafeCameraDown": "S", -> not configurable yet
}